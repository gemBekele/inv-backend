server {
    listen 80; # Listen for incoming HTTP requests on port 80
    listen [::]:80; # Listen for IPv6 requests as well

    # Define the server name(s) that Nginx should respond to.
    # Replace <YOUR_INSTANCE_PUBLIC_IP> with your actual EIP.
    # If you have a domain name (e.g., dev.yourstartup.com), add it here too.
    # If you don't have a specific domain/IP yet, '_' acts as a catch-all.
    server_name 196.190.220.46; 

    # Basic proxy settings to ensure correct request forwarding to the backend.
    # These headers pass important client information (like original host, IP, and protocol)
    # from Nginx to your NestJS application.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Important for WebSocket connections (e.g., if your NestJS app uses WebSockets)
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';

    # Define the primary location block.
    # This 'location /' block will handle all requests that don't match
    # more specific location blocks (if you add any later).
    location / {
        # Proxy all requests to your 'app' service running on port 3000
        # 'app' is the service name defined in your docker-compose.yml,
        # allowing Nginx to resolve it within the Docker network.
        proxy_pass http://app:3000;

        # Optional: Add caching directives if needed for static assets or API responses
        # proxy_cache_valid 200 302 10m;
        # proxy_cache_valid 404 1m;
        # proxy_cache my_cache;
    }

    # Error page configurations
    # These define custom pages for HTTP error codes.
    error_page 404 /404.html;
    location = /40x.html {
        # Serve a custom 404 page if you create one in /var/www/html or similar
        # root /usr/share/nginx/html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        # Serve a custom 5xx error page
        # root /usr/share/nginx/html;
    }
}
